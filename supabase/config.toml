# MaleMetrix — Supabase-Projektkonfiguration (CLI).
# Zweck dieser Datei: die Platform-JWT-Prüfung (verify_jwt) für mm-commerce
# ausschalten. Grund: Dieses Projekt nutzt neue asymmetrische Signing Keys
# (ES256). Die vorgeschaltete Legacy-verify_jwt-Ebene der Edge Functions kann
# ES256-signierte User-Tokens nicht verifizieren und antwortet mit 401, BEVOR
# der Function-Handler läuft (der Gateway-Log dekodiert den User nur fürs
# Logging). Supabase empfiehlt für diesen Fall genau das hier:
#   verify_jwt = false  +  Auth sicher IM Handler validieren.
#
# WICHTIG: Das macht mm-commerce NICHT öffentlich. Der Handler verlangt
# zwingend einen Authorization-Bearer-Token und validiert ihn autoritativ
# über service.auth.getUser(jwt); ohne gültigen User → 401. Kein Vertrauen
# in ungeprüfte JWT-Claims.
project_id = "vczhfyxltiyvtvppfodt"

[functions.mm-commerce]
verify_jwt = false

# resolve-product-access hatte denselben Fehler (ANON_KEY + getUser() ohne
# Token) und liegt im „Zugriff nach Login"-Pfad. Ebenfalls verify_jwt=false;
# der Handler validiert den Bearer-Token autoritativ und filtert Entitlements
# strikt auf user_id des validierten Nutzers.
[functions.resolve-product-access]
verify_jwt = false

# mm-ai + delete-account: identischer ES256-Fall (P10/P0.6). Beide Handler
# validieren den Bearer-Token selbst über service.auth.getUser(jwt) —
# verify_jwt=false macht sie NICHT öffentlich, es verlagert die (mit ES256
# funktionierende) Prüfung in den Handler. Auth-Muster: _shared/edge.mjs.
[functions.mm-ai]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

# score-telemetry ist ein bewusst ÖFFENTLICHER, pseudonymer Ingest: Der Score
# ist anonym nutzbar, ein Login-Zwang wäre für die Privatsphäre ein Rückschritt.
# Es gibt deshalb keinen User-Token, den verify_jwt prüfen könnte. Der Schutz
# liegt woanders: Origin-Allowlist, strikte Allowlist-Validierung (validate.mjs,
# kein Freitextfeld), Idempotenz über event_id, RLS ohne Policy auf der Tabelle.
[functions.score-telemetry]
verify_jwt = false

# site-telemetry: identischer Fall wie score-telemetry — anonyme Besucher haben
# keinen Token. Schutz über Origin-Allowlist, Allowlist-Validierung ohne
# Freitextfeld, Idempotenz über event_id und RLS ohne Policy auf site_events.
[functions.site-telemetry]
verify_jwt = false

# mm-admin: identischer ES256-Fall (P0.6) — der Handler validiert den
# Bearer-Token selbst (admin.auth.getUser) und prüft die Owner-Rolle gegen
# public.user_roles. Ohne diesen Eintrag lehnt die Platform-Ebene jeden
# Browser-Aufruf mit 401 ab, BEVOR der Handler läuft.
[functions.mm-admin]
verify_jwt = false

# mm-usage: gleicher ES256-Fall wie mm-admin — der Handler prüft den
# Bearer-Token selbst und verlangt die Owner-Rolle. Nur lesend (Nutzungsbericht).
[functions.mm-usage]
verify_jwt = false

# send-brief wird NICHT vom Browser mit User-JWT aufgerufen, sondern vom
# Scheduler (pg_cron/extern) mit x-scheduler-secret. Ohne verify_jwt=false
# würde die Platform-Ebene jeden Scheduler-Call ablehnen. Der Handler lehnt
# alles ohne korrektes SCHEDULER_SECRET mit 403 ab.
[functions.send-brief]
verify_jwt = false

# mm-transform: identischer ES256-Fall wie mm-ai (P0.6) — der Handler
# validiert den Bearer-Token selbst über service.auth.getUser(jwt) und
# rate-limitiert pro Nutzer (Bildgenerierung kostet echtes Geld).
# verify_jwt=false macht die Function NICHT öffentlich.
[functions.mm-transform]
verify_jwt = false

# mm-translate: bewusst ÖFFENTLICH — anonyme Besucher haben keinen Token, und
# ein Login-Zwang nur zum Lesen der englischen Fassung wäre absurd. Schutz über
# Origin-Allowlist, harte Größengrenzen pro Anfrage, Monats- und Stundenbudget
# sowie den Server-Cache (jeder Satz kostet genau einmal). RLS ohne Policy auf
# public.translations: Clients kommen an die Tabelle nicht heran.
[functions.mm-translate]
verify_jwt = false

# Gen 2 — persönlicher Kalender-Feed. GET ist token-basiert (Apple Kalender
# kann keinen JWT senden), POST validiert den Bearer-JWT im Handler (P0.6).
[functions.mm-plan-ics]
verify_jwt = false
