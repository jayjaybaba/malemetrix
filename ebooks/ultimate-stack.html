<script src="../js/config.js"></script>
<script src="../js/vault.js"></script>
<script src="../js/analytics.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/main.js"></script>
<script src="../js/affiliates.js"></script>
<script>
(function () {
  "use strict";
  var gate = document.getElementById("stackGate");
  var content = document.getElementById("stackContent");
  var input = document.getElementById("stackCode");
  var btn = document.getElementById("stackUnlock");
  var err = document.getElementById("stackErr");
  var bar = document.getElementById("bpProgress");
  var STORE = "mm_stack_code";

  function progress() { var h = document.documentElement; var max = h.scrollHeight - h.clientHeight; bar.style.width = (max > 0 ? (h.scrollTop / max * 100) : 0) + "%"; }
  document.addEventListener("scroll", progress, { passive: true });

  function show(html) {
    content.innerHTML = html;
    gate.hidden = true; content.hidden = false;
    progress();
    if (window.MM && MM.track) MM.track("stack_unlocked", {});
  }
  async function attempt(code, silent) {
    var c = MM.vault.norm(code);
    if (!c) { if (!silent) { err.style.display = "block"; input.focus(); } return false; }
    try {
      var html = await MM.vault.open("stackVault", c);
      try { localStorage.setItem(STORE, c); } catch (e) {}
      show(html);
      return true;
    } catch (e) {
      if (!silent) { err.style.display = "block"; input.focus(); }
      return false;
    }
  }
  (async function init() {
    try {
      var urlCode = new URLSearchParams(location.search).get("code");
      if (urlCode && await attempt(urlCode, true)) {
        history.replaceState(null, "", location.pathname);
        return;
      }
      var saved = "";
      try { saved = localStorage.getItem(STORE) || ""; } catch (e) {}
      if (saved) await attempt(saved, true);
    } catch (e) { /* Gate bleibt sichtbar */ }
  })();
  if (btn) btn.addEventListener("click", function () { attempt(input.value); });
  if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(input.value); });
})();
</script>
