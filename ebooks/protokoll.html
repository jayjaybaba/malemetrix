<script src="../js/config.js"></script>
<script src="../js/vault.js"></script>
<script src="../js/analytics.js"></script>
<script src="../js/shop-data.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/main.js"></script>
<script src="../js/account.js"></script>
<script src="../js/affiliates.js"></script>
<script>
(function () {
  "use strict";
  var gate = document.getElementById("protoGate");
  var content = document.getElementById("protoContent");
  var input = document.getElementById("protoCode");
  var btn = document.getElementById("protoUnlock");
  var err = document.getElementById("protoErr");
  var bar = document.getElementById("bpProgress");
  var STORE = "mm_protokoll_code";
  var SCROLL_KEY = "mm_protokoll_scroll";
  var PROG_KEY = "mm_protokoll_progress";

  function progress() { var h = document.documentElement; var max = h.scrollHeight - h.clientHeight; bar.style.width = (max > 0 ? (h.scrollTop / max * 100) : 0) + "%"; }
  var onScroll = null;   // wird von setupReading gesetzt, sobald der Text steht
  document.addEventListener("scroll", function () {
    progress();
    if (onScroll) onScroll();
  }, { passive: true });

  function show(html) {
    content.innerHTML = html;
    gate.hidden = true; content.hidden = false;
    if (window.MM && MM.track) MM.track("protokoll_unlocked", {});
    progress();
    setupReading();
    startMotion();
  }
  /* MM / MECHANISM — die Motion-Instrumente spielen erst, wenn sie im
     Viewport stehen; stumm, preload=none, respektiert prefers-reduced-motion.
     Muss nach der Injektion laufen, weil die Videos vorher nicht im DOM sind. */
  function startMotion() {
    var vids = document.querySelectorAll(".bp-mech-video");
    if (!vids.length) return;
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (!("IntersectionObserver" in window)) return;
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        var v = e.target;
        if (e.isIntersecting) {
          if (v.ended) { try { v.currentTime = 0; } catch (x) {} }
          var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
        } else { try { v.pause(); } catch (x) {} }
      });
    }, { threshold: 0.35 });
    vids.forEach(function (v) { io.observe(v); });
  }
  function setupReading() {
    var top = document.createElement("button");
    top.type = "button"; top.textContent = "↑ Inhalt"; top.setAttribute("aria-label", "Zum Inhaltsverzeichnis");
    top.className = "no-print";
    top.style.cssText = "position:fixed;right:16px;bottom:16px;z-index:60;padding:10px 14px;border:none;border-radius:999px;background:linear-gradient(135deg,#2e7cf6,#00c2ff);color:#fff;font-weight:700;font-size:0.85rem;box-shadow:0 6px 20px rgba(13,15,19,0.25);cursor:pointer;opacity:0;transition:opacity .2s;pointer-events:none";
    document.body.appendChild(top);
    /* Sofort springen, NICHT smooth: ein animierter Scroll über das gesamte
       Werk (sehr langes Dokument) zwingt iOS Safari, jeden Abschnitt auf dem
       Weg zu rendern — Speicherspitze, WebKit beendet die Seite („Ein
       Problem ist wiederholt aufgetreten"). */
    top.addEventListener("click", function () { window.scrollTo(0, 0); });
    var saved = 0; try { saved = parseInt(localStorage.getItem(SCROLL_KEY) || "0", 10) || 0; } catch (e) {}
    if (saved > 600 && saved < document.documentElement.scrollHeight - window.innerHeight) {
      var pill = document.createElement("button");
      pill.type = "button"; pill.textContent = "⤵ Weiterlesen, wo du aufgehört hast"; pill.className = "no-print";
      pill.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:61;padding:11px 18px;border:none;border-radius:999px;background:#0d0f13;color:#fff;font-weight:600;font-size:0.9rem;box-shadow:0 8px 26px rgba(0,0,0,0.35);cursor:pointer;max-width:92vw";
      document.body.appendChild(pill);
      var hide = function () { if (pill && pill.parentNode) pill.parentNode.removeChild(pill); };
      /* Gleicher Grund wie beim „↑ Inhalt"-Knopf: sofort springen statt
         smooth über zigtausend Pixel animieren. */
      pill.addEventListener("click", function () { window.scrollTo(0, saved); hide(); });
      setTimeout(hide, 9000);
    }
    /* Struktureller Lesefortschritt für My MaleMetrix (Weiterlesen-Kachel):
       Prozent ist ein Höchststand (Zurückspringen zum Inhaltsverzeichnis
       senkt ihn nicht), „done" bleibt gesetzt. Kapitel werden defensiv über
       die Überschriften des entschlüsselten Werks erkannt — findet sich
       nichts Brauchbares, bleibt es beim ehrlichen Prozentwert. */
    var chapterHeads = (function () {
      var hs = [].slice.call(content.querySelectorAll("h2"));
      if (hs.length < 3) hs = [].slice.call(content.querySelectorAll("h3"));
      return hs.filter(function (el) { return el.offsetParent !== null && (el.textContent || "").trim(); });
    })();
    function saveProgress() {
      try {
        var doc = document.documentElement;
        var max = doc.scrollHeight - doc.clientHeight;
        var y = window.scrollY || window.pageYOffset;
        var pctNow = max > 0 ? Math.min(100, Math.round(y / max * 100)) : 0;
        var prev = null;
        try { prev = JSON.parse(localStorage.getItem(PROG_KEY) || "null"); } catch (e) {}
        var pct = Math.max(pctNow, (prev && prev.pct) || 0);
        var out = { v: 1, pct: pct, done: !!(prev && prev.done) || pct >= 97, ts: Date.now() };
        if (chapterHeads.length) {
          out.chTotal = chapterHeads.length;
          if (pctNow >= ((prev && prev.pct) || 0) || !(prev && prev.title)) {
            var mark = y + doc.clientHeight * 0.4, idx = 0;
            for (var i = 0; i < chapterHeads.length; i++) {
              if (chapterHeads[i].getBoundingClientRect().top + y <= mark) idx = i; else break;
            }
            out.ch = idx + 1;
            out.title = (chapterHeads[idx].textContent || "").trim().slice(0, 90);
          } else {
            out.ch = prev.ch; out.title = prev.title;
          }
        } else if (prev) { out.ch = prev.ch; out.chTotal = prev.chTotal; out.title = prev.title; }
        localStorage.setItem(PROG_KEY, JSON.stringify(out));
      } catch (e) {}
    }
    saveProgress();
    /* Kein zweiter Scroll-Listener: Fortschrittsbalken, Zurück-Knopf und das
       Merken der Leseposition teilen sich denselben Handler (siehe progress). */
    var t = null;
    onScroll = function () {
      var y = window.scrollY || window.pageYOffset;
      top.style.opacity = y > 500 ? "1" : "0";
      top.style.pointerEvents = y > 500 ? "auto" : "none";
      if (t) return;
      t = setTimeout(function () { t = null; try { localStorage.setItem(SCROLL_KEY, String(window.scrollY || window.pageYOffset)); } catch (e) {} saveProgress(); }, 400);
    };
  }
  async function attempt(code, silent, noPersist) {
    var c = MM.vault.norm(code);
    if (!c) { if (!silent) { err.style.display = "block"; input.focus(); } return false; }
    try {
      var html = await MM.vault.open("protoVault", c);
      if (!noPersist) { try { localStorage.setItem(STORE, c); } catch (e) {} }
      show(html);
      return true;
    } catch (e) {
      if (!silent) { err.style.display = "block"; input.focus(); }
      return false;
    }
  }
  (async function init() {
    try {
      var urlCode = new URLSearchParams(location.search).get("code");
      if (urlCode && await attempt(urlCode, true)) { history.replaceState(null, "", location.pathname); return; }
      var saved = ""; try { saved = localStorage.getItem(STORE) || ""; } catch (e) {}
      if (saved && await attempt(saved, true)) return;
      if (window.MM && MM.account && MM.account.whenReady) {
        await MM.account.whenReady();
        if (MM.account.hasAccess("protocol")) {
          var acc = await MM.account.resolveProductAccess("protocol");
          if (acc && acc.state === "authorized" && acc.material) await attempt(acc.material, true, true);
        }
      }
    } catch (e) { /* Gate bleibt sichtbar */ }
  })();
  if (btn) btn.addEventListener("click", function () { attempt(input.value); });
  if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(input.value); });
})();
</script>
